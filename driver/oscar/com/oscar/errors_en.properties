//Driver\u4e2d\u7684Properties
DRIVER_DBNAME=Database name to connect to; may be specified directly in the JDBC URL.
DRIVER_DBHOST=Hostname of the PostgreSQL server; may be specified directly in the JDBC URL.
DRIVER_DBPORT=Port number to connect to the PostgreSQL server on; may be specified directly in the JDBC URL.
DRIVER_LOGLEVEL=Log level:0 is off, can be divided into: 0,1,2,3,4 
DRIVER_LOGFILEPATH=Log file path, the default and JDBC driver in the same directory.
DRIVER_LOGINTIMEOUT=The login timeout
DRIVER_REQUESTTIMEOUT=Network request timeout
DRIVER_NOTREALPREPARE=Do not use prepare, prepare operation will not go prepare interface, is take the query interface, directly send the query
DRIVER_COMPATIBLEOLDPROTOCOL=Whether to use the old agreement to interact with the background.
DRIVER_FETCHSIZE=A result set rows retrieved from the database
DRIVER_PREPARESIMPLEEXECUTE=Whether can go directly with no arguments prepare statement query protocol executing SQL statements
DRIVER_VERIFYPOOLCONNECTIN=From the connection pool to obtain a connection, whether the connection
DRIVER_USEASYNBATCH=If the batch using asynchronous mode to send data
DRIVER_BATCHCOUNT=Batch asynchronously send send the number of rows at a time
DRIVER_TCPKEEPALIVE=Enable or disable TCP keep-alive probe.
DRIVER_USEDISPATCH=Whether to enable distributed function
DRIVER_USEASYNCHRONOUS=Whether the read operation can be distributed to an unforced synchronous standby, the default is true
DRIVER_USESLAVESYNCREAD=Reading and writing separation is reading for machine waiting for machine data synchronization is complete
DRIVER_TRANSACTIONDISPATCHSTRATEGY=Things of the statement in distribution strategy
DRIVER_VALIDTESTSTRING=The string for validity of the connection test
DRIVER_CHECKDBLINKSQL=Whether to check dblink sql, if checked and is dblink sql, direct execute
DRIVER_SENDBINARYTYPEASHEX=Whether to check bulk insert column type